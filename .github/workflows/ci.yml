name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # One run each on the other platforms: font discovery is the part most
          # likely to differ, and it is the part a new user hits first.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install a monospace font (Linux runners carry no guarantee)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Test
        run: python -m unittest discover -s tests -v

  render:
    name: render a real loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and a monospace font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
          python -m pip install dist/*.whl

      - name: Render from a scene, as a new user would
        run: |
          cd "$(mktemp -d)"
          asciibg --scene starfield --loop 2 --fps 12 -o out
          test -s out/starfield.mp4
          test -s out/starfield.gif
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt \
            -of csv=p=0 out/starfield.mp4 | tee /dev/stderr | grep -qx 'h264,1920,1080,yuv420p'

      - name: Render from a prompt
        run: |
          cd "$(mktemp -d)"
          asciibg --prompt "slow heavy snow on a cold blue night" --loop 2 --fps 12 -o out
          test -s out/rain.mp4

      - name: Measure a picture with the probe, then preview one frame of it
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          a = np.zeros((180, 320, 3), dtype=np.uint8)
          a[60:70, 20:60] = (255, 128, 40)     # a tan thing to find
          a[120:126, :] = (230, 0, 170)        # a magenta surface to run it along
          Image.fromarray(a).save("probe.png")
          PY
          python -m tools.probe probe.png --cols 160 --rows 45 --find blobs --hue 25 \
            | tee /dev/stderr | grep -q 'left='
          python -m tools.probe probe.png --cols 160 --rows 45 --find ridge --hue 320 \
            --band 25-35 | tee /dev/stderr | grep -q 'x0='
          # The preview path takes no ffmpeg, so it is worth proving it writes a frame
          # and nothing else.
          asciibg probe.png --cols 160 --rows 45 -o still --still 3
          test -s still/probe.png
          test ! -e still/probe.mp4
