[project]
name = "asciibg"
version = "0.1.0"
description = "Seamlessly looping ASCII video backgrounds, from a base image or a procedural scene"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mjones" }]
keywords = ["ascii", "ascii-art", "animation", "zoom", "background", "gif", "video"]
dependencies = ["pillow>=10", "numpy>=1.24"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/MttJns/asciibg"
Source = "https://github.com/MttJns/asciibg"
Issues = "https://github.com/MttJns/asciibg/issues"

[project.scripts]
asciibg = "asciibg.cli:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX license expression support
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, or flat-layout discovery sees `tests` beside `asciibg` and refuses.
packages = ["asciibg"]
